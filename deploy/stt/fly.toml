# Speech-to-text for the Falacias live game: whisper.cpp `small` on a shared CPU. NOT public: no [http_service], reached only over
# Fly's private network by the app `livebingo` as http://livebingo-stt.internal:8080 (STT_URL).
# Create once:  fly apps create livebingo-stt --org <same org as livebingo>
# Deploy:       fly deploy --config deploy/stt/fly.toml --dockerfile deploy/stt/Dockerfile --ha=false --no-public-ips
app = "livebingo-stt"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[[vm]]
  size = "shared-cpu-4x"
  memory = "2gb"
