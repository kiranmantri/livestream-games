[project]
name = "live-games"
version = "0.1.0"
description = "Games to play while a YouTube live stream is running (first game: Bingo)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-fasthtml>=0.12",
    "psycopg[binary,pool]>=3.2",
    "yt-dlp>=2026.3.17",
    "tzdata>=2026.5",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
checker = [
    "httpx>=0.28.1",
    "pydantic-ai-slim[duckduckgo,openai]>=2.61.0",
]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
corpus = "corpus.cli:main"
migrate = "app.db:migrate_cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "corpus"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
default-groups = ["dev", "checker"]
